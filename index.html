    /* Reveal */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s, transform .6s; }
    .reveal.visible { opacity: 1; transform: none; }
    .d1 { transition-delay: .1s; } .d2 { transition-delay: .2s; } .d3 { transition-delay: .3s; }

    /* Section styles */
    .section-eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #C4722A; }
    .section-title { font-family: 'DM Serif Display', Georgia, serif; font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1.05; color: #1C1A18; margin-top: 8px; }

    /* Cards */

      background: #fff; border: 1px solid #EDE5D8; border-radius: 20px; padding: 28px 26px;

    .feature-card:hover { box-shadow: 0 12px 40px rgba(196,114,42,.12); transform: translateY(-3px); border-color: #C4722A; }

    /* Review card */

    /* Lightbox */

    .lb-arrow { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.15); border: none; color: white; width: 48px; height: 48px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; }

<script>
// Navbar burger
document.getElementById('burger').addEventListener('click', () => {
  const m = document.getElementById('mobile-nav');
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
});
function closeMob() { document.getElementById('mobile-nav').style.display = 'none'; }

// Scroll reveal
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

// Date picker (simple)
const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
let dateIn = null, dateOut = null;
function setDate(type) {
  const d = new Date();
  if (type === 'in') {
    d.setDate(d.getDate() + 2);
    dateIn = d;
    document.getElementById('date-in-display').textContent = d.getDate() + ' ' + months[d.getMonth()];
    document.getElementById('date-in-display').style.color = '#1C1A18';
    document.getElementById('date-in-display').style.fontWeight = '500';
    if (!dateOut) {
      const dOut = new Date(d); dOut.setDate(dOut.getDate() + 3); dateOut = dOut;
      document.getElementById('date-out-display').textContent = dOut.getDate() + ' ' + months[dOut.getMonth()];
      document.getElementById('date-out-display').style.color = '#1C1A18';
      document.getElementById('date-out-display').style.fontWeight = '500';
    }
  }
  updateBookLink();
}
function updateBookLink() {
  const btn = document.getElementById('book-btn');
  let msg = 'Здравствуйте! Хочу забронировать домик в BALIYA.';
  if (dateIn) {
    msg += ' Заезд: ' + dateIn.getDate() + ' ' + months[dateIn.getMonth()];
    if (dateOut) msg += ', выезд: ' + dateOut.getDate() + ' ' + months[dateOut.getMonth()];
    const g = document.getElementById('guests-display').textContent;
    msg += '. ' + g + '.';
  }
  btn.href = 'https://wa.me/79289786078?text=' + encodeURIComponent(msg);
}

// Guests cycle
const guestOpts = ['1 гость','2 гостя','3 гостя','4 гостя','5 гостей','6 гостей'];
let guestIdx = 1;
function cycleGuests() {
  guestIdx = (guestIdx + 1) % guestOpts.length;
  document.getElementById('guests-display').textContent = guestOpts[guestIdx];
  updateBookLink();
}

// Chat
var chatOpen = false, chatStarted = false;
var WA = 'https://wa.me/79289786078';
function toggleChat() {
  chatOpen = !chatOpen;
  var win = document.getElementById('chat-window');
  if (chatOpen) { win.classList.add('open'); if (!chatStarted) { initChat(); chatStarted = true; } }
  else win.classList.remove('open');
}
function initChat() { botMsg('Здравствуйте! Я ассистент BALIYA. Помогу с бронированием домика на Каспии. Чем могу помочь?'); }
function botMsg(text) {
  var m = document.getElementById('chat-msgs');
  var d = document.createElement('div'); d.className = 'msg-bot'; d.innerHTML = text;
  m.appendChild(d); m.scrollTop = m.scrollHeight;
}
function userMsg(text) {
  var m = document.getElementById('chat-msgs');
  var d = document.createElement('div'); d.className = 'msg-user'; d.textContent = text;
  m.appendChild(d); m.scrollTop = m.scrollHeight;
}
function ask(text) { userMsg(text); setTimeout(function(){reply(text);}, 400); }
function sendMsg() {
  var inp = document.getElementById('chat-input'), text = inp.value.trim();
  if (!text) return; inp.value = ''; userMsg(text); setTimeout(function(){reply(text);}, 400);
}
function reply(text) {
  var t = text.toLowerCase();
  if (t.includes('бронир') || t.includes('забронир') || t.includes('хочу')) {
    botMsg('Для бронирования напишите нам в WhatsApp — ответим быстро и подберём домик!<br><br><a href="' + WA + '?text=Здравствуйте! Хочу забронировать домик в BALIYA." target="_blank" style="background:#C4722A;color:#fff;padding:.45rem 1rem;border-radius:8px;text-decoration:none;font-size:.78rem;display:inline-block;margin-top:.3rem">Написать в WhatsApp →</a>');
  } else if (t.includes('цен') || t.includes('сколько') || t.includes('стоит')) {
    botMsg('Стоимость зависит от домика и сезона:<br><br><b>Стандарт</b> — от 5 000 ₽/сутки<br><b>Комфорт</b> — от 7 000 ₽/сутки<br><b>Премиум</b> — от 10 000 ₽/сутки<br><br>Точную цену уточним в WhatsApp.');
  } else if (t.includes('удобств') || t.includes('входит') || t.includes('есть')) {
    botMsg('В каждом домике: спальные места, душ, кондиционер, телевизор, кухня, мангал, Wi-Fi, парковка. Выход к Каспию 100м.');
  } else if (t.includes('адрес') || t.includes('добраться') || t.includes('где')) {
    botMsg('Мы находимся в Избербаше на берегу Каспийского моря, Дагестан. Точный адрес отправим при подтверждении брони.');
  } else {
    botMsg('Спасибо за вопрос! Для быстрого ответа напишите в WhatsApp.<br><br><a href="' + WA + '" target="_blank" style="background:#C4722A;color:#fff;padding:.45rem 1rem;border-radius:8px;text-decoration:none;font-size:.78rem;display:inline-block;margin-top:.3rem">Написать в WhatsApp →</a>');
  }
}
</script>
